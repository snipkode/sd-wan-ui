<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>SD UI — Wan 1.3B</title>
<style>
:root {
  color-scheme: dark;
  --bg: #000;
  --panel: rgba(28, 28, 30, .82);
  --panel-2: rgba(44, 44, 46, .72);
  --stroke: rgba(255, 255, 255, .11);
  --text: #f5f5f7;
  --muted: #98989f;
  --blue: #0a84ff;
  --cyan: #64d2ff;
  --green: #30d158;
  --red: #ff453a;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { max-width: 100%; overflow-x: clip; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background: radial-gradient(1100px 520px at 50% -12%, #18304f 0%, #05070b 52%, #000 100%) fixed, #000;
  -webkit-font-smoothing: antialiased;
}
header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: calc(10px + env(safe-area-inset-top)) 14px 10px;
  background: rgba(0, 0, 0, .62);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--stroke);
}
header > div { min-width: 0; }
h1, h2, p { margin: 0; }
h1 { font-size: 16px; font-weight: 650; letter-spacing: -.35px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
h1 span { color: var(--muted); font-weight: 500; }
header p, .sub, .clock, small { color: var(--muted); }
header p { font-size: 11px; margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill {
  flex: none;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .4px;
  text-transform: uppercase;
  background: rgba(255, 255, 255, .08);
  color: var(--muted);
  border: 1px solid var(--stroke);
}
.pill.ok { background: rgba(48, 209, 88, .14); color: var(--green); }
.pill.bad { background: rgba(255, 69, 58, .14); color: var(--red); }
main {
  width: min(100%, 880px);
  margin: 0 auto;
  padding: 12px 10px calc(22px + env(safe-area-inset-bottom));
  display: grid;
  gap: 12px;
}
.surface {
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 18px 50px rgba(0, 0, 0, .38);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
}
.section-head, .gallery-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}
h2 { font-size: 15px; font-weight: 640; letter-spacing: -.2px; }
.sub, .clock { font-size: 11px; margin-top: 2px; }
label {
  display: block;
  margin-bottom: 4px;
  color: var(--muted);
  font-size: 10px;
  font-weight: 650;
  letter-spacing: .25px;
}
textarea, input, select {
  width: 100%;
  min-width: 0;
  min-height: 38px;
  padding: 8px 10px;
  color: var(--text);
  background: rgba(255, 255, 255, .06);
  border: 1px solid var(--stroke);
  border-radius: 10px;
  outline: none;
  font: inherit;
  font-size: 14px;
}
textarea { min-height: 62px; resize: vertical; line-height: 1.35; }
textarea:focus, input:focus, select:focus { border-color: rgba(10, 132, 255, .8); box-shadow: 0 0 0 3px rgba(10, 132, 255, .16); }
input[disabled], select:disabled { color: var(--muted); opacity: .7; }
select option { background: #1c1c1e; color: var(--text); }
small { display: block; font-size: 9px; margin-top: 3px; }
.prompt-label { margin-top: 8px; }
#presetHint.warn { color: var(--red); }
.preset, .quick, .adv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.preset > div, .quick > div, .adv > div { min-width: 0; }
.preset.single { grid-template-columns: 1fr; }
.quick { margin-top: 8px; }
details { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--stroke); }
summary {
  cursor: pointer;
  list-style: none;
  color: var(--blue);
  font-size: 11px;
  font-weight: 650;
}
summary::-webkit-details-marker { display: none; }
details[open] .adv { margin-top: 8px; }
.adv .wide { grid-column: 1 / -1; }
button {
  font: inherit;
  cursor: pointer;
  border: 0;
}
.primary {
  width: 100%;
  min-height: 40px;
  margin-top: 10px;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(135deg, var(--blue), #0071e3);
  font-size: 14px;
  font-weight: 650;
  box-shadow: 0 8px 24px rgba(10, 132, 255, .3);
  transition: transform .12s ease, opacity .12s ease;
}
.primary:active { transform: scale(.985); }
.primary:disabled { opacity: .55; cursor: not-allowed; box-shadow: none; }
.mode { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 3px; border: 1px solid var(--stroke); border-radius: 11px; background: rgba(255, 255, 255, .04); }
.mode button { min-height: 32px; border-radius: 8px; color: var(--muted); background: transparent; font-size: 12px; font-weight: 650; }
.mode button.active { color: var(--text); background: rgba(10, 132, 255, .22); box-shadow: inset 0 0 0 1px rgba(10, 132, 255, .4); }
.status { display: flex; align-items: center; gap: 8px; margin-top: 10px; min-width: 0; }
.badge {
  flex: none;
  padding: 4px 8px;
  border-radius: 999px;
  font-size: 9px;
  font-weight: 750;
  letter-spacing: .5px;
  text-transform: uppercase;
  background: rgba(255, 255, 255, .08);
  color: var(--muted);
}
.badge.ok { background: rgba(48, 209, 88, .16); color: var(--green); }
.badge.bad { background: rgba(255, 69, 58, .16); color: var(--red); }
.badge.busy { background: rgba(10, 132, 255, .18); color: var(--cyan); }
.badge.stopped { background: rgba(255, 159, 10, .16); color: #ff9f0a; }
.stop {
  flex: none;
  min-height: 26px;
  padding: 0 10px;
  border-radius: 999px;
  color: var(--red);
  background: rgba(255, 69, 58, .12);
  border: 1px solid rgba(255, 69, 58, .35);
  font-size: 10px;
  font-weight: 700;
}
.stop:disabled { opacity: .5; cursor: not-allowed; }
#jobMeta { min-width: 0; color: var(--muted); font-size: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.track { height: 4px; margin-top: 8px; border-radius: 999px; background: rgba(255, 255, 255, .1); overflow: hidden; }
#barFill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--cyan)); transition: width .25s ease; }
.log {
  max-height: 120px;
  margin: 8px 0 0;
  padding: 8px 10px;
  overflow: auto;
  color: #d1d1d6;
  background: rgba(0, 0, 0, .34);
  border: 1px solid var(--stroke);
  border-radius: 10px;
  font: 10px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.filters { display: flex; flex-wrap: wrap; gap: 5px; min-width: 0; }
.chip {
  padding: 6px 10px;
  border-radius: 999px;
  color: var(--muted);
  background: rgba(255, 255, 255, .06);
  border: 1px solid var(--stroke);
  font-size: 10px;
  font-weight: 650;
}
.chip.active { color: #fff; background: var(--blue); border-color: transparent; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.card {
  min-width: 0;
  overflow: hidden;
  background: var(--panel);
  border: 1px solid var(--stroke);
  border-radius: 14px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
}
.media { position: relative; background: #000; cursor: zoom-in; }
.card img, .card video { display: block; width: 100%; height: 130px; }
.card img { object-fit: cover; }
.card video { object-fit: contain; }
.tag {
  position: absolute;
  top: 6px;
  right: 6px;
  padding: 3px 6px;
  border-radius: 999px;
  background: rgba(0, 0, 0, .65);
  color: var(--cyan);
  font-size: 8px;
  font-weight: 800;
  letter-spacing: .5px;
}
.meta { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 7px 9px; }
.meta a { min-width: 0; overflow: hidden; color: var(--text); font-size: 10px; text-decoration: none; text-overflow: ellipsis; white-space: nowrap; }
.meta a:hover { color: var(--cyan); }
.size { flex: none; color: var(--muted); font-size: 9px; }
.download {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  color: var(--cyan);
  background: rgba(100, 210, 255, .12);
  border: 1px solid rgba(100, 210, 255, .3);
  font-size: 12px;
  text-decoration: none;
}
.download:hover { background: rgba(100, 210, 255, .2); }
.delete {
  flex: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 8px;
  color: var(--red);
  background: rgba(255, 69, 58, .1);
  border: 1px solid rgba(255, 69, 58, .28);
  font-size: 11px;
  font-weight: 700;
}
.delete:hover { background: rgba(255, 69, 58, .18); }
.empty { padding: 18px; color: var(--muted); text-align: center; font-size: 11px; border: 1px dashed var(--stroke); border-radius: 14px; }
.pagination { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px; }
.page-btn {
  min-height: 30px;
  padding: 0 12px;
  border-radius: 999px;
  color: var(--text);
  background: rgba(255, 255, 255, .08);
  border: 1px solid var(--stroke);
  font-size: 11px;
  font-weight: 650;
}
.page-btn:disabled { opacity: .4; cursor: not-allowed; }
#pageInfo { min-width: 56px; color: var(--muted); font-size: 10px; text-align: center; }
.lightbox {
  position: relative;
  width: min(calc(100vw - 24px), 960px);
  max-width: none;
  max-height: calc(100vh - 24px);
  padding: 12px;
  color: var(--text);
  background: rgba(10, 10, 12, .96);
  border: 1px solid var(--stroke);
  border-radius: 16px;
  box-shadow: 0 24px 80px rgba(0, 0, 0, .7);
}
.lightbox::backdrop { background: rgba(0, 0, 0, .78); backdrop-filter: blur(6px); }
.lightbox-media { display: flex; align-items: center; justify-content: center; min-height: 180px; }
.lightbox-media img, .lightbox-media video { display: block; max-width: 100%; max-height: calc(100vh - 120px); width: auto; height: auto; border-radius: 10px; }
.lightbox-close, .lightbox-nav {
  position: absolute;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text);
  background: rgba(255, 255, 255, .1);
  border: 1px solid var(--stroke);
  font-weight: 700;
}
.lightbox-close { top: 8px; right: 8px; width: 30px; height: 30px; border-radius: 50%; font-size: 16px; }
.lightbox-nav { top: 50%; width: 34px; height: 34px; border-radius: 50%; transform: translateY(-50%); font-size: 18px; }
.lightbox-nav.prev { left: 8px; }
.lightbox-nav.next { right: 8px; }
.lightbox-nav:disabled { opacity: .3; cursor: not-allowed; }
.lightbox-caption { margin-top: 8px; color: var(--muted); font-size: 11px; text-align: center; overflow-wrap: anywhere; }
@media (min-width: 700px) {
  main { padding: 16px; }
  .adv { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .adv .wide { grid-column: span 2; }
  .log { max-height: 160px; }
  .gallery { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
  .card img, .card video { height: 140px; }
}
@media (max-width: 520px) {
  header { padding-left: 10px; padding-right: 10px; }
  h1 { font-size: 14px; }
  header p { font-size: 10px; }
  main { gap: 10px; padding: 10px 8px calc(18px + env(safe-area-inset-bottom)); }
  .surface { padding: 11px; border-radius: 14px; }
  .gallery-head { align-items: flex-start; }
  .gallery { gap: 6px; }
  .card img, .card video { height: 100px; }
  .meta { padding: 6px; }
  .log { max-height: 96px; font-size: 9px; }
}
@media (max-width: 360px) {
  .mode, .preset, .quick, .adv { grid-template-columns: 1fr; }
  .adv .wide { grid-column: auto; }
  .filters { width: 100%; }
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Wan 1.3B <span>· CPU</span></h1>
    <p>stable-diffusion.cpp · realtime</p>
  </div>
  <span id="conn" class="pill">connecting</span>
</header>
<main>
  <section class="surface">
    <div class="section-head">
      <div>
        <h2>Generate</h2>
        <p class="sub">Wan 2.1 T2V · Q4_K_M</p>
      </div>
      <span id="clock" class="clock">—</span>
    </div>
    <form id="genForm">
      <div class="mode" role="group" aria-label="Mode generate">
        <button type="button" id="modeImage" class="active" aria-pressed="true">Gambar</button>
        <button type="button" id="modeVideo" aria-pressed="false">Video</button>
      </div>
      <div class="preset" id="presetRow">
        <div>
          <label for="presetDuration">Durasi video</label>
          <select id="presetDuration">
            <option value="">Pilih durasi</option>
          </select>
        </div>
        <div>
          <label for="presetQuality">Kualitas</label>
          <select id="presetQuality">
            <option value="">Pilih kualitas</option>
          </select>
        </div>
      </div>
      <small id="presetHint">Pilih durasi + kualitas untuk mengisi config otomatis.</small>
      <label for="prompt" class="prompt-label">Prompt</label>
      <textarea id="prompt" maxlength="500" spellcheck="false">a lovely cat walking in neon rain, cinematic lighting, shallow depth of field</textarea>
      <div class="quick">
        <div>
          <label for="frames">Frames</label>
          <input id="frames" type="number" min="1" max="961" value="1">
          <small>1 = PNG, &gt;1 = video</small>
        </div>
        <div>
          <label for="steps">Steps</label>
          <input id="steps" type="number" min="1" max="50" value="10">
          <small>CPU: 4–10 cukup</small>
        </div>
      </div>
      <details id="advanced">
        <summary>Pengaturan lanjutan</summary>
        <div class="adv">
          <div>
            <label for="cfg">CFG</label>
            <input id="cfg" type="number" min="0" max="20" step="0.5" value="6">
          </div>
          <div>
            <label for="sampler">Sampler</label>
            <input id="sampler" value="euler" disabled>
          </div>
          <div>
            <label for="width">Width</label>
            <input id="width" type="number" min="256" max="1024" step="16" value="512">
          </div>
          <div>
            <label for="height">Height</label>
            <input id="height" type="number" min="256" max="1024" step="16" value="320">
          </div>
          <div class="wide">
            <label for="negative">Negative prompt</label>
            <input id="negative" maxlength="500" value="blurry, low quality, watermark, text">
          </div>
        </div>
      </details>
      <button id="genBtn" class="primary" type="submit">Generate Gambar</button>
    </form>
    <div class="status">
      <span id="jobStatus" class="badge">idle</span>
      <span id="jobMeta">siap</span>
      <button id="stopBtn" class="stop" type="button" hidden>Stop</button>
    </div>
    <div class="track"><div id="barFill"></div></div>
    <pre id="log" class="log">Menunggu event...</pre>
  </section>
  <section>
    <div class="gallery-head">
      <div>
        <h2>Hasil</h2>
        <p id="fileCount" class="sub">0 file</p>
      </div>
      <div class="filters">
        <button class="chip active" data-filter="all">Semua</button>
        <button class="chip" data-filter="image">Gambar</button>
        <button class="chip" data-filter="video">Video</button>
      </div>
    </div>
    <div id="gallery" class="gallery"></div>
    <p id="empty" class="empty" hidden>Belum ada hasil.</p>
    <div id="pagination" class="pagination" hidden>
      <button id="prevPage" class="page-btn" type="button">← Prev</button>
      <span id="pageInfo">1 / 1</span>
      <button id="nextPage" class="page-btn" type="button">Next →</button>
    </div>
  </section>
</main>
<dialog id="lightbox" class="lightbox">
  <button id="lightboxClose" class="lightbox-close" type="button" aria-label="Tutup">×</button>
  <button id="lightboxPrev" class="lightbox-nav prev" type="button" aria-label="Sebelumnya">‹</button>
  <div id="lightboxMedia" class="lightbox-media"></div>
  <button id="lightboxNext" class="lightbox-nav next" type="button" aria-label="Berikutnya">›</button>
  <p id="lightboxCaption" class="lightbox-caption"></p>
</dialog>
<script>
const $ = (id) => document.getElementById(id);
const conn = $('conn');
const log = $('log');
const gallery = $('gallery');
const empty = $('empty');
const jobStatus = $('jobStatus');
const jobMeta = $('jobMeta');
const genBtn = $('genBtn');
const stopBtn = $('stopBtn');
const barFill = $('barFill');
const fileCount = $('fileCount');
const clock = $('clock');
const presetDuration = $('presetDuration');
const presetQuality = $('presetQuality');
const presetHint = $('presetHint');
const presetRow = $('presetRow');
const modeImage = $('modeImage');
const modeVideo = $('modeVideo');
const pagination = $('pagination');
const prevPage = $('prevPage');
const nextPage = $('nextPage');
const pageInfo = $('pageInfo');
const lightbox = $('lightbox');
const lightboxMedia = $('lightboxMedia');
const lightboxCaption = $('lightboxCaption');
const lightboxClose = $('lightboxClose');
const lightboxPrev = $('lightboxPrev');
const lightboxNext = $('lightboxNext');

let generateMode = 'image';
let presetData = null;
let galleryFiles = [];
let activeFilter = 'all';
let currentPage = 1;
let galleryLoading = false;
let galleryPending = false;
let lightboxIndex = -1;
let currentJob = null;
let logReady = false;
const PAGE_SIZE = 12;
const ACTIVE_STATUSES = ['starting', 'running', 'decoding', 'encoding', 'stopping'];

if (window.innerWidth < 700) $('advanced').open = false;

function setConn(text, ok) {
  conn.textContent = text;
  conn.className = `pill ${ok ? 'ok' : 'bad'}`;
}

function pushLog(line) {
  if (!logReady) {
    log.textContent = '';
    logReady = true;
  }
  log.textContent += `${log.textContent ? '\n' : ''}${line}`;
  const lines = log.textContent.split('\n');
  if (lines.length > 140) log.textContent = lines.slice(-140).join('\n');
  log.scrollTop = log.scrollHeight;
}

function fmt(size) {
  if (size < 1024) return `${size} B`;
  if (size < 1024 * 1024) return `${(size / 1024).toFixed(0)} KB`;
  return `${(size / 1024 / 1024).toFixed(1)} MB`;
}

function applyPreset() {
  presetHint.className = '';
  if (!presetData) return;
  const quality = presetData.qualities[presetQuality.value];
  if (quality) {
    $('steps').value = String(quality.steps);
    $('cfg').value = String(quality.cfg);
    $('width').value = String(quality.width);
    $('height').value = String(quality.height);
  }
  if (generateMode === 'image') {
    $('frames').value = '1';
    presetHint.textContent = quality
      ? `Mode gambar · ${quality.label} · ${quality.width}x${quality.height} · ${quality.steps} step`
      : 'Mode gambar: frames dikunci ke 1. Pilih kualitas untuk mengisi config.';
    return;
  }
  const duration = presetData.durations.find((d) => String(d.seconds) === presetDuration.value);
  if (!duration || !quality) {
    presetHint.textContent = 'Pilih durasi + kualitas untuk mengisi config otomatis.';
    return;
  }
  $('frames').value = String(duration.frames);
  const warning = duration.frames >= 401 ? ' · berat, bisa sangat lama di CPU' : '';
  presetHint.textContent = `${duration.frames} frame ≈ ${duration.actualSeconds}s · ${quality.label} · ${quality.width}x${quality.height} · ${quality.steps} step${warning}`;
  if (duration.frames >= 401) presetHint.className = 'warn';
}

async function loadPresets() {
  try {
    const response = await fetch('/api/presets');
    if (!response.ok) throw new Error('gagal memuat preset');
    presetData = await response.json();
    presetDuration.innerHTML = '<option value="">Pilih durasi</option>';
    presetQuality.innerHTML = '<option value="">Pilih kualitas</option>';
    for (const d of presetData.durations) {
      const option = document.createElement('option');
      option.value = String(d.seconds);
      option.textContent = `${d.seconds} detik (${d.frames} frame)`;
      presetDuration.appendChild(option);
    }
    for (const [key, q] of Object.entries(presetData.qualities)) {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = `${q.label} · ${q.width}x${q.height} · ${q.steps} step`;
      presetQuality.appendChild(option);
    }
    $('frames').max = String(presetData.maxFrames);
    applyPreset();
  } catch (err) {
    presetHint.textContent = `Preset tidak tersedia: ${err.message}`;
    presetHint.className = 'warn';
  }
}

function setMode(mode) {
  generateMode = mode === 'video' ? 'video' : 'image';
  const isImage = generateMode === 'image';
  modeImage.classList.toggle('active', isImage);
  modeVideo.classList.toggle('active', !isImage);
  modeImage.setAttribute('aria-pressed', String(isImage));
  modeVideo.setAttribute('aria-pressed', String(!isImage));
  presetDuration.parentElement.hidden = isImage;
  presetRow.classList.toggle('single', isImage);
  presetDuration.disabled = isImage;
  $('frames').disabled = isImage;
  $('frames').min = isImage ? '1' : '2';
  if (isImage) $('frames').value = '1';
  else if (Number($('frames').value) < 2) $('frames').value = '9';
  applyPreset();
  if (!presetData) presetHint.textContent = isImage
    ? 'Mode gambar: frames dikunci ke 1.'
    : 'Mode video: pilih durasi + kualitas atau atur frames manual.';
}

function renderProgress(progress) {
  const pct = Math.max(0, Math.min(100, Number(progress && progress.percent) || 0));
  barFill.style.width = `${pct}%`;
  if (currentJob && ACTIVE_STATUSES.includes(currentJob.status) && currentJob.status !== 'stopping') {
    jobMeta.textContent = `${currentJob.frames} frame · ${pct}% · ${progress.current || 0}/${progress.total || currentJob.progress.total || 0}`;
  }
}

function renderJob(job) {
  currentJob = job;
  const genLabel = generateMode === 'image' ? 'Generate Gambar' : 'Generate Video';
  if (!job) {
    jobStatus.textContent = 'idle';
    jobStatus.className = 'badge';
    jobMeta.textContent = 'siap';
    renderProgress({ percent: 0 });
    genBtn.disabled = false;
    genBtn.textContent = genLabel;
    stopBtn.hidden = true;
    return;
  }
  const busy = ACTIVE_STATUSES.includes(job.status);
  const tone = job.status === 'done' ? 'ok' : job.status === 'error' ? 'bad' : job.status === 'stopped' ? 'stopped' : 'busy';
  jobStatus.textContent = job.status;
  jobStatus.className = `badge ${tone}`;
  if (job.error) jobMeta.textContent = job.error.slice(0, 110);
  else if (job.warning) jobMeta.textContent = job.warning.slice(0, 110);
  else if (job.status === 'done') jobMeta.textContent = job.output ? `selesai · ${job.output}` : 'selesai';
  else if (job.status === 'stopped') jobMeta.textContent = 'dihentikan · tanpa output akhir';
  else jobMeta.textContent = `${job.frames} frame · ${job.progress.percent || 0}%`;
  renderProgress(job.progress || { percent: 0 });
  genBtn.disabled = busy;
  genBtn.textContent = busy ? 'Generating…' : genLabel;
  stopBtn.hidden = !busy;
  stopBtn.disabled = job.status === 'stopping';
  stopBtn.textContent = job.status === 'stopping' ? 'Stopping…' : 'Stop';
}

function renderCounts(counts) {
  if (!counts) return;
  fileCount.textContent = `${counts.all} file · ${counts.video} video`;
}

function renderLightbox() {
  const f = galleryFiles[lightboxIndex];
  lightboxMedia.textContent = '';
  lightboxPrev.disabled = lightboxIndex <= 0;
  lightboxNext.disabled = lightboxIndex >= galleryFiles.length - 1;
  if (!f) {
    lightboxCaption.textContent = '';
    return;
  }
  const src = `/out/${encodeURIComponent(f.name)}`;
  if (f.type === 'video') {
    const video = document.createElement('video');
    video.src = src;
    video.controls = true;
    video.autoplay = true;
    video.playsInline = true;
    lightboxMedia.appendChild(video);
  } else {
    const img = document.createElement('img');
    img.src = src;
    img.alt = f.name;
    lightboxMedia.appendChild(img);
  }
  lightboxCaption.textContent = `${f.name} · ${fmt(f.size)}`;
}

function showLightbox(index) {
  if (index < 0 || index >= galleryFiles.length) return;
  lightboxIndex = index;
  renderLightbox();
  if (!lightbox.open) lightbox.showModal();
}

function renderGallery(files) {
  galleryFiles = files;
  gallery.textContent = '';
  empty.hidden = files.length > 0;
  empty.textContent = activeFilter === 'video'
    ? 'Belum ada video. Set Frames > 1 saat generate.'
    : 'Belum ada hasil.';
  files.forEach((f, index) => {
    const card = document.createElement('div');
    card.className = 'card';
    const media = document.createElement('div');
    media.className = 'media';
    const src = `/out/${encodeURIComponent(f.name)}`;
    if (f.type === 'video') {
      const video = document.createElement('video');
      video.src = src;
      video.controls = true;
      video.preload = 'metadata';
      video.playsInline = true;
      media.appendChild(video);
      const tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = 'VIDEO';
      media.appendChild(tag);
    } else {
      const img = document.createElement('img');
      img.src = src;
      img.alt = f.name;
      img.loading = 'lazy';
      media.appendChild(img);
    }
    media.addEventListener('click', () => showLightbox(index));

    const meta = document.createElement('div');
    meta.className = 'meta';
    const link = document.createElement('a');
    link.href = src;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = f.name;
    link.title = f.name;
    const size = document.createElement('span');
    size.className = 'size';
    size.textContent = fmt(f.size);
    const download = document.createElement('a');
    download.className = 'download';
    download.href = `${src}?download=1`;
    download.download = f.name;
    download.title = 'Download';
    download.textContent = '↓';
    download.setAttribute('aria-label', `Download ${f.name}`);
    const remove = document.createElement('button');
    remove.className = 'delete';
    remove.type = 'button';
    remove.textContent = '×';
    remove.title = 'Hapus';
    remove.setAttribute('aria-label', `Hapus ${f.name}`);
    remove.addEventListener('click', () => deleteAssetFile(f.name));
    meta.append(link, size, download, remove);
    card.append(media, meta);
    gallery.appendChild(card);
  });
}

async function deleteAssetFile(name) {
  if (!confirm(`Hapus ${name}?`)) return;
  try {
    const response = await fetch('/api/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'gagal menghapus file');
    if (lightbox.open && galleryFiles[lightboxIndex] && galleryFiles[lightboxIndex].name === name) lightbox.close();
    pushLog(`hapus: ${name}`);
    await loadFiles(currentPage);
  } catch (err) {
    pushLog(`ERROR: ${err.message}`);
    alert(err.message);
  }
}

async function loadFiles(targetPage = currentPage) {
  if (galleryLoading) {
    galleryPending = true;
    return;
  }
  galleryLoading = true;
  prevPage.disabled = true;
  nextPage.disabled = true;
  try {
    const params = new URLSearchParams({ page: String(targetPage), limit: String(PAGE_SIZE), type: activeFilter });
    const response = await fetch(`/api/files?${params}`);
    if (!response.ok) throw new Error('gagal memuat hasil');
    const data = await response.json();
    currentPage = data.page;
    renderCounts(data.counts);
    renderGallery(data.files);
    pageInfo.textContent = `${data.page} / ${data.pages}`;
    pagination.hidden = data.pages <= 1;
    prevPage.disabled = !data.hasPrev;
    nextPage.disabled = !data.hasNext;
  } catch (err) {
    empty.hidden = false;
    empty.textContent = `Gagal memuat hasil: ${err.message}`;
  } finally {
    galleryLoading = false;
    if (galleryPending) {
      galleryPending = false;
      loadFiles(currentPage);
    }
  }
}

const es = new EventSource('/api/stream');
es.addEventListener('open', () => setConn('live', true));
es.addEventListener('error', () => setConn('reconnect', false));
es.addEventListener('hello', (event) => {
  const data = JSON.parse(event.data);
  renderJob(data.job);
  renderCounts(data.counts);
});
es.addEventListener('status', (event) => renderJob(JSON.parse(event.data).job));
es.addEventListener('progress', (event) => renderProgress(JSON.parse(event.data).progress));
es.addEventListener('log', (event) => pushLog(JSON.parse(event.data).line));
es.addEventListener('files', (event) => {
  renderCounts(JSON.parse(event.data).counts);
  loadFiles(currentPage);
});
es.addEventListener('file', (event) => pushLog(`file baru: ${event.data ? JSON.parse(event.data).file.name : ''}`));

modeImage.addEventListener('click', () => setMode('image'));
modeVideo.addEventListener('click', () => setMode('video'));
presetDuration.addEventListener('change', applyPreset);
presetQuality.addEventListener('change', applyPreset);
setMode('image');
loadPresets();
loadFiles(1);

$('genForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  if (Number($('frames').value) >= 401 && !confirm(`Video ${$('frames').value} frame bisa memakan waktu sangat lama di CPU 2 core. Lanjutkan?`)) return;
  const payload = {
    prompt: $('prompt').value.trim(),
    negative: $('negative').value.trim(),
    frames: Number($('frames').value),
    steps: Number($('steps').value),
    cfg: Number($('cfg').value),
    width: Number($('width').value),
    height: Number($('height').value)
  };
  if (generateMode === 'image') payload.frames = 1;
  else if (payload.frames < 2) payload.frames = 9;
  genBtn.disabled = true;
  genBtn.textContent = 'Starting…';
  try {
    const response = await fetch('/api/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'gagal memulai inference');
    logReady = false;
    pushLog(`job ${data.job.id} dimulai · ${data.job.output}`);
    renderJob(data.job);
  } catch (err) {
    pushLog(`ERROR: ${err.message}`);
    alert(err.message);
    renderJob(currentJob);
  }
});

stopBtn.addEventListener('click', async () => {
  if (!currentJob || !ACTIVE_STATUSES.includes(currentJob.status) || currentJob.status === 'stopping') return;
  if (!confirm(`Hentikan job ${currentJob.id}? Proses yang sudah berjalan akan dihentikan tanpa output akhir.`)) return;
  stopBtn.disabled = true;
  stopBtn.textContent = 'Stopping…';
  try {
    const response = await fetch('/api/cancel', { method: 'POST' });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'gagal menghentikan job');
    renderJob(data.job);
    pushLog(`stop requested · ${data.job.id}`);
  } catch (err) {
    pushLog(`ERROR: ${err.message}`);
    alert(err.message);
    renderJob(currentJob);
  }
});

for (const chip of document.querySelectorAll('.chip')) {
  chip.addEventListener('click', () => {
    activeFilter = chip.dataset.filter;
    for (const c of document.querySelectorAll('.chip')) c.classList.toggle('active', c === chip);
    loadFiles(1);
  });
}

prevPage.addEventListener('click', () => loadFiles(currentPage - 1));
nextPage.addEventListener('click', () => loadFiles(currentPage + 1));
lightboxClose.addEventListener('click', () => lightbox.close());
lightboxPrev.addEventListener('click', () => showLightbox(lightboxIndex - 1));
lightboxNext.addEventListener('click', () => showLightbox(lightboxIndex + 1));
lightbox.addEventListener('close', () => {
  lightboxMedia.textContent = '';
  lightboxCaption.textContent = '';
});
lightbox.addEventListener('keydown', (event) => {
  if (event.key === 'ArrowLeft') {
    event.preventDefault();
    showLightbox(lightboxIndex - 1);
  } else if (event.key === 'ArrowRight') {
    event.preventDefault();
    showLightbox(lightboxIndex + 1);
  }
});

setInterval(async () => {
  try {
    const response = await fetch('/api/health');
    const data = await response.json();
    clock.textContent = `up ${data.uptime}s`;
  } catch {
    clock.textContent = 'offline';
  }
}, 5000);
</script>
</body>
</html>
