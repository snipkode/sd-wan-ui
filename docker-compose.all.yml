services:
  sd-wan:
    image: ${SD_ALL_IMAGE:-snipkode/sd-wan:latest}
    build:
      context: .
      dockerfile: Dockerfile.bundle
    container_name: sd-wan
    ports:
      - "${UI_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      UI_TOKEN: ${UI_TOKEN:-}
      MODEL_DIR: /models
      OUT_DIR: /output
      INPUT_DIR: /input
      INPAINT_MODEL_DIR: /inpaint
      INPAINT_MODEL_NAME: ${INPAINT_MODEL_NAME:-stable-diffusion-v1-5-inpainting-Q4_0.gguf}
      STATE_FILE: /app/runtime/state.json
      SD_RUNNER: local
      SD_CLI_BIN: /sd.cpp/bin/sd-cli
      SD_BACKEND: ${SD_BACKEND:-cpu}
      SD_EXTRA_ARGS: ${SD_EXTRA_ARGS:-}
      FFMPEG_BIN: /usr/bin/ffmpeg
      KEEP_AVI: ${KEEP_AVI:-0}
    volumes:
      - ./models:/models
      - ./models/inpaint:/inpaint:ro
      - ./input:/input
      - ./out:/output
      - ./runtime:/app/runtime
    restart: unless-stopped
