services:
  ui:
    image: ${SD_UI_IMAGE:-snipkode/sd-wan-ui:latest}
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: sd-wan-ui
    ports:
      - "${UI_PORT:-3001}:3001"
    environment:
      HOST: 0.0.0.0
      PORT: "3001"
      UI_TOKEN: ${UI_TOKEN:-}
      OUT_DIR: /app/out
      OUT_HOST_DIR: ${OUT_HOST_DIR:-${PWD}/out}
      MODEL_DIR: /app/models
      MODEL_HOST_DIR: ${MODEL_HOST_DIR:-${PWD}/models}
      INPUT_DIR: /app/input
      INPUT_HOST_DIR: ${INPUT_HOST_DIR:-${PWD}/input}
      INPAINT_MODEL_DIR: /inpaint
      INPAINT_MODEL_HOST_DIR: ${INPAINT_MODEL_HOST_DIR:-${PWD}/models/inpaint}
      INPAINT_MODEL_NAME: ${INPAINT_MODEL_NAME:-stable-diffusion-v1-5-inpainting-Q4_0.gguf}
      STATE_FILE: /app/runtime/state.json
      SD_IMAGE: ${SD_IMAGE:-snipkode/sd-wan-infer:latest}
      SD_BACKEND: ${SD_BACKEND:-cpu}
      SD_PARAMS_BACKEND: ${SD_PARAMS_BACKEND:-}
      SD_MAX_VRAM: ${SD_MAX_VRAM:-}
      SD_THREADS: ${SD_THREADS:-}
      GPU_DEVICES: ${GPU_DEVICES:-all}
      VULKAN_DEVICE: ${VULKAN_DEVICE:-/dev/dri}
      SD_EXTRA_ARGS: ${SD_EXTRA_ARGS:-}
      FFMPEG_BIN: /usr/bin/ffmpeg
      KEEP_AVI: ${KEEP_AVI:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./server.js:/app/server.js:ro
      - ./public:/app/public:ro
      - ./models:/app/models
      - ./models/inpaint:/inpaint:ro
      - ./input:/app/input
      - ./out:/app/out
      - ./runtime:/app/runtime
    restart: unless-stopped
